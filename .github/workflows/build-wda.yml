name: Build WDA IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone WebDriverAgent (iOS 12 era)
        run: |
          git clone https://github.com/appium/WebDriverAgent.git wda
          cd wda
          COMMIT=$(git rev-list -1 --before="2021-04-01" HEAD)
          echo "WDA_COMMIT=$COMMIT"
          git checkout $COMMIT
          ls -la Scripts | head -20

      - name: Bootstrap dependencies
        run: |
          cd wda
          pwd
          ls -la Scripts
          bash Scripts/bootstrap.sh

      - name: Build Runner app (unsigned)
        run: |
          cd wda
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath /tmp/wda_derived \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            build-for-testing

      - name: Package WDA.ipa
        run: |
          APP=$(find /tmp/wda_derived/Build/Products -maxdepth 1 -type d -name 'WebDriverAgentRunner-Runner.app' | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p /tmp/wda_out/Payload
          cp -R "$APP" /tmp/wda_out/Payload/
          rm -rf /tmp/wda_out/Payload/WebDriverAgentRunner-Runner.app/Frameworks/XC*
          cd /tmp/wda_out
          zip -qr /tmp/WDA.ipa Payload
          ls -lh /tmp/WDA.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA.ipa
          path: /tmp/WDA.ipa
