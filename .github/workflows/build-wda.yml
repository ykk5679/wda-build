name: Build WDA IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Clone WebDriverAgent v5.15.8
        run: |
          git clone --depth 1 --branch v5.15.8 https://github.com/appium/WebDriverAgent.git wda

      - name: Build Runner app (unsigned)
        working-directory: wda
        run: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath /tmp/wda_derived \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            build

      - name: Package WDA.ipa
        run: |
          APP=$(find /tmp/wda_derived/Build/Products -maxdepth 2 -type d -name 'WebDriverAgentRunner-Runner.app' | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p /tmp/wda_out/Payload
          cp -R "$APP" /tmp/wda_out/Payload/
          rm -rf /tmp/wda_out/Payload/WebDriverAgentRunner-Runner.app/Frameworks/XC*
          find /tmp/wda_out -name '*.dSYM' -type d -exec rm -rf {} + 2>/dev/null || true
          find /tmp/wda_out -type d -name '_CodeSignature' -exec rm -rf {} + 2>/dev/null || true
          cd /tmp/wda_out
          zip -qr /tmp/WDA.ipa Payload
          ls -lh /tmp/WDA.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA.ipa
          path: /tmp/WDA.ipa